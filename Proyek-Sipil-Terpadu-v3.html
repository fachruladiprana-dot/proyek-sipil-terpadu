<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
//#region core
const DAY=86400000;
const p2=n=>String(n).padStart(2,'0');
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN;};
const fd=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());};
function normW(wbs){const tot=wbs.reduce((a,w)=>a+(+w.weight||0),0);return{tot,items:wbs.map(w=>({...w,nw:tot>0?(+w.weight||0)*100/tot:0}))};}
function planAt(items,t){let s=0;for(const w of items){const a=pd(w.start),b=pd(w.end);if(isNaN(a)||isNaN(b)||b<a)continue;s+=w.nw*Math.max(0,Math.min(1,(t-a+DAY)/(b-a+DAY)));}return s;}
function latestPct(entries){const m={};for(const e of entries){if(!e.wbsId||e.pct==null||e.pct==='')continue;(m[e.wbsId]=m[e.wbsId]||[]).push({date:e.date,pct:+e.pct,ts:e.ts||0});}for(const k in m)m[k].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.ts-y.ts);return m;}
function pctOf(pm,id,ds){const a=pm[id];if(!a)return null;for(let i=a.length-1;i>=0;i--)if(a[i].date<=ds)return a[i].pct;return null;}
function realAt(items,pm,t){const ds=fd(t);let s=0;for(const w of items){const v=pctOf(pm,w.id,ds);if(v!=null)s+=w.nw*Math.max(0,Math.min(100,v))/100;}return s;}
function curve(items,pm,todayT){let a=Infinity,b=-Infinity;for(const w of items){const s=pd(w.start),e=pd(w.end);if(!isNaN(s)&&!isNaN(e)&&e>=s){a=Math.min(a,s);b=Math.max(b,e);}}if(!isFinite(a)||!isFinite(b))return null;const grid=[];for(let t=a;t<b;t+=7*DAY)grid.push(t);grid.push(b);const plan=grid.map(t=>[t,planAt(items,t)]);const rg=grid.filter(t=>t<=todayT);if(todayT>=a&&todayT<=b&&!rg.includes(todayT))rg.push(todayT);const real=rg.map(t=>[t,realAt(items,pm,t)]);return{plan,real};}
function status(dev){return dev>=-2?(dev>2?['Lebih cepat','good']:['Sesuai','good']):dev>=-10?['Waspada','warn']:['Terlambat','bad'];}
function stockOf(g){const m={};for(const e of g){const k=(e.material||'').trim().toLowerCase()+'|'+(e.unit||'').trim().toLowerCase();const o=m[k]||(m[k]={name:(e.material||'').trim(),unit:(e.unit||'').trim(),in:0,out:0,ret:0});const q=+e.qty||0;if(e.jenis==='Masuk')o.in+=q;else if(e.jenis==='Keluar')o.out+=q;else o.ret+=q;}return Object.values(m).map(o=>({...o,stock:o.in-o.out-o.ret})).sort((a,b)=>a.name.localeCompare(b.name));}
function weatherCorr(k3,items,pm){const by={};for(const e of k3){const r=['pagi','siang','sore'].filter(k=>/^Hujan/.test(e[k]||'')).length;const o=by[e.date]||(by[e.date]={rain:0});o.rain=Math.max(o.rain,r);}const g=[[],[],[]];for(const d in by){const t=pd(d);if(isNaN(t))continue;const gain=realAt(items,pm,t)-realAt(items,pm,t-DAY);g[by[d].rain===0?0:by[d].rain===1?1:2].push(gain);}return[['Tanpa hujan',g[0]],['1 sesi hujan',g[1]],['2-3 sesi hujan',g[2]]].map(([l,a])=>({l,n:a.length,avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:null}));}
//#endregion
</script>
<script>
(function(){
'use strict';
const ZALL='Semua zona';
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const CUACA=['Cerah','Berawan','Hujan ringan','Hujan lebat'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=x=>(Math.round(x*10)/10).toString().replace('.',',');
const n2=x=>(Math.round(x*100)/100).toString().replace('.',',');
const sg=x=>(x>0?'+':'')+n1(x);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const dl=s=>{const t=pd(s);if(isNaN(t))return s||'';const d=new Date(t);return HARI[d.getUTCDay()]+', '+d.getUTCDate()+' '+BLN[d.getUTCMonth()]+' '+d.getUTCFullYear();};
const ds=s=>{const t=pd(s);if(isNaN(t))return s||'';const d=new Date(t);return d.getUTCDate()+' '+BLN[d.getUTCMonth()];};
const safeUrl=u=>{try{const x=new URL(String(u).trim(),location.href);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return'';}};
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return'';}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const S={screen:'boot',pid:'',projects:[],projLoaded:false,me:{name:'',email:''},meCloud:false,mode:'cloud',canEdit:false,unsub:[],dataSub:false,W:null,mcp:null,drv:{msg:'',url:'',busy:false},db:null,assets:null,dl:null,role:'loading',tab:'',cfg:null,wbs:[],site:[],gudang:[],drafter:[],k3:[],laporan:[],date:today(),zone:'all',form:'site',pm:{},open:'',confirm:'',loaded:{},err:'',busy:'',inputBuilt:false};
const ATT={site:[],gudang:[],drafter:[]};
const COLS=['site','gudang','drafter','k3'];

/* ---------- derived ---------- */
const zones=()=>(S.cfg&&S.cfg.zones)||[];
const rabVal=w=>(+w.vol||0)*(+w.price||0);
const rp=x=>'Rp '+Math.round(+x||0).toLocaleString('id-ID');
function wbsN(zone){
  const all=S.wbs,rab=all.length>0&&all.every(w=>rabVal(w)>0);
  const base=rab?all.map(w=>({...w,weight:rabVal(w)})):all;
  const l=zone&&zone!=='all'?base.filter(w=>w.zone===zone||!w.zone):base;
  const r=normW(l);if(rab)r.tot=100;r.rab=rab;return r;
}
const fe=(list,date,zone)=>list.filter(e=>e.date===date&&(zone==='all'||e.zone===zone||e.zone===ZALL));
function sum(a,f){return a.reduce((x,e)=>x+(+f(e)||0),0);}
function dayData(date,zone){
  const se=fe(S.site,date,zone),ge=fe(S.gudang,date,zone),de=fe(S.drafter,date,zone),ke=fe(S.k3,date,zone);
  const t=pd(date),{items}=wbsN(zone);
  const plan=planAt(items,t),real=realAt(items,S.pm,t);
  const alatMap={};se.forEach(e=>(e.alat||[]).forEach(a=>{if(a.n)alatMap[a.n.trim().toLowerCase()]=a;}));
  const alat=Object.values(alatMap);
  const hrs=se.filter(e=>+e.hours>0);
  return{date,zone,se,ge,de,ke,plan,real,dev:real-plan,workers:sum(se,e=>e.workers),hours:hrs.length?sum(hrs,e=>e.hours)/hrs.length:0,alat,
    gain:real-realAt(items,S.pm,t-DAY),henti:sum(ke,e=>e.henti)};
}
function flagsFor(date,zone){
  const out=[];const zs=zone==='all'?zones():[zone];
  zs.forEach(z=>{const p=S.site.some(e=>e.date===date&&e.zone===z);const o=S.gudang.some(e=>e.date===date&&e.zone===z&&e.jenis==='Keluar');
    if(p&&!o)out.push(z+': ada progres, belum ada material keluar tercatat.');
    if(!p&&o)out.push(z+': ada material keluar, belum ada laporan progres.');});
  return out;
}
const fileLinks=files=>(files||[]).map(f=>{const u=safeUrl(f.u);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(f.n||'Lampiran')}</a>`:esc(f.n||'');}).join(', ');

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},3200);}

/* ---------- chart ---------- */
function chartSVG(c,todayT){
  if(!c||!c.plan.length)return'<div class="empty">Kurva S muncul setelah item WBS punya bobot dan tanggal rencana.</div>';
  const W=400,H=250,L=34,R=12,T=14,B=30;const t0=c.plan[0][0],t1=c.plan[c.plan.length-1][0];
  const x=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R),y=v=>T+(1-v/100)*(H-T-B);
  let g='';[0,25,50,75,100].forEach(v=>{g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;});
  for(let i=0;i<5;i++){const t=t0+(t1-t0)*i/4;g+=`<text x="${x(t)}" y="${H-10}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${ds(fd(Math.round(t/DAY)*DAY))}</text>`;}
  const path=a=>a.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva S rencana dan realisasi">${g}`;
  if(todayT>=t0&&todayT<=t1)s+=`<line x1="${x(todayT)}" x2="${x(todayT)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  s+=`<path d="${path(c.plan)}" fill="none" stroke="var(--plan)" stroke-width="2"/>`;
  if(c.real.length){s+=`<path d="${path(c.real)}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;const l=c.real[c.real.length-1];s+=`<circle cx="${x(l[0])}" cy="${y(l[1])}" r="4" fill="var(--accent)"/>`;}
  return s+'</svg><div class="legend"><span><i style="background:var(--plan)"></i>Rencana</span><span><i style="background:var(--accent)"></i>Realisasi</span><span>Garis putus: tanggal terpilih</span></div>';
}

function vKurva(){

  let mo='';if(c){const a=new Date(c.plan[0][0]),e=c.plan[c.plan.length-1][0];let y=a.getUTCFullYear(),m=a.getUTCMonth();for(;;){const end=Math.min(Date.UTC(y,m+1,0),e);const p=planAt(items,end);const r=end<=t?realAt(items,S.pm,end):null;mo+=`<tr><td>${BLN[m]} ${y}</td><td class="n">${n1(p)}</td><td class="n">${r==null?'-':n1(r)}</td><td class="n ${r!=null&&r-p<0?'neg':''}">${r==null?'-':sg(r-p)}</td></tr>`;if(end>=e)break;m++;if(m>11){m=0;y++;}}}
  return filterBar()+`<div class="card"><h3>Kurva S</h3>${chartSVG(c,t)}${Math.abs(tot-100)>0.01&&items.length?`<p class="note">Total bobot ${n1(tot)}%, dinormalisasi ke 100%.</p>`:''}</div>

  <div class="card"><h3>Rekap bulanan</h3>${mo?`<div class="tw"><table><thead><tr><th>Bulan</th><th class="n">Rencana</th><th class="n">Real.</th><th class="n">Dev</th></tr></thead><tbody>${mo}</tbody></table></div>`:'<div class="empty">Belum ada data.</div>'}</div></div>`;

const asc=s=>String(s==null?'':s).replace(/[^\n\x20-\x7E -ÿ]/g,'');
function mkPdf(orient){
  const jsPDF=window.jspdf&&window.jspdf.jsPDF;if(!jsPDF)throw new Error('Pustaka PDF belum termuat.');
  const doc=new jsPDF({orientation:orient,unit:'mm',format:'a4'});const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=14;let y=M;
  const api={doc,W,H,M,gy:()=>y,sy:v=>{y=v;},
    need(h){if(y+h>H-M){doc.addPage();y=M;}},
    text(s,o){o=o||{};const size=o.size||10,lh=size*0.43;doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...(o.color||[27,36,48]));const x=M+(o.indent||0);const lines=doc.splitTextToSize(asc(s),W-M-x);api.need(lines.length*lh+(o.gap==null?1.6:o.gap));doc.text(lines,x,y+lh*0.85);y+=lines.length*lh+(o.gap==null?1.6:o.gap);},
    head(title,sub){doc.setFillColor(27,36,48);doc.rect(0,0,W,24,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(asc(title),M,11);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(asc(sub),M,18);y=32;},
    kpis(list){const w=(W-2*M-(list.length-1)*4)/list.length;list.forEach((k,i)=>{const x=M+i*(w+4);doc.setDrawColor(200,205,200);doc.rect(x,y,w,16);doc.setTextColor(91,104,118);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text(asc(k[0]).toUpperCase(),x+3,y+5);doc.setTextColor(27,36,48);doc.setFont('courier','bold');doc.setFontSize(13);doc.text(asc(k[1]),x+3,y+12.5);});y+=22;},
    h(s){api.need(10);y+=2;api.text(s,{bold:true,size:11,gap:1,color:[194,74,20]});doc.setDrawColor(214,218,212);doc.line(M,y,W-M,y);y+=2;},
    sign(){api.need(34);y+=8;const w=(W-2*M)/3;['Dibuat oleh','Diperiksa','Disetujui'].forEach((l,i)=>{doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(27,36,48);doc.text(l,M+i*w,y);doc.line(M+i*w,y+22,M+i*w+w-10,y+22);});y+=26;},
    foot(){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,140);doc.text('Halaman '+i+' dari '+n,W-M,H-6,{align:'right'});}}};
  return api;
}
function drawCurve(P,x,y,w,h,c){
  const d=P.doc;const t0=c.plan[0][0],t1=c.plan[c.plan.length-1][0];const X=t=>x+(t-t0)/((t1-t0)||1)*w,Y=v=>y+h-(v/100)*h;
  d.setDrawColor(214,218,212);d.setLineWidth(0.2);d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(91,104,118);
  [0,25,50,75,100].forEach(v=>{d.line(x,Y(v),x+w,Y(v));d.text(String(v),x-2,Y(v)+1,{align:'right'});});
  for(let i=0;i<5;i++){const t=t0+(t1-t0)*i/4;d.text(asc(ds(fd(Math.round(t/DAY)*DAY))),X(t),y+h+5,{align:i===0?'left':i===4?'right':'center'});}
  const line=(a,col,lw)=>{d.setDrawColor(...col);d.setLineWidth(lw);for(let i=1;i<a.length;i++)d.line(X(a[i-1][0]),Y(a[i-1][1]),X(a[i][0]),Y(a[i][1]));};
  line(c.plan,[44,93,145],0.6);if(c.real.length>1)line(c.real,[194,74,20],0.8);
  d.setLineWidth(0.2);d.setFillColor(44,93,145);d.rect(x,y+h+9,6,1.2,'F');d.text('Rencana',x+8,y+h+10);d.setFillColor(194,74,20);d.rect(x+30,y+h+9,6,1.2,'F');d.text('Realisasi',x+38,y+h+10);
}

  if(!l.length)return'<div class="empty">Belum ada item WBS.</div>';
  const wn=wbsN('all'),nw={};wn.items.forEach(w=>{nw[w.id]=w.nw;});
  const totRab=sum(l,rabVal);
  return`<div class="list">${l.map(w=>`<div class="item"><div><b>${esc(w.code||'')} ${esc(w.name)}</b><br><small>${esc(w.zone||'Umum')} · ${rabVal(w)>0?esc(n1(+w.vol))+' '+esc(w.unit||'')+' × '+rp(w.price)+' = '+rp(rabVal(w)):'bobot manual'} · ${n1(nw[w.id]||0)}% · ${esc(ds(w.start))} - ${esc(ds(w.end))}</small></div><div class="btns"><button class="btn sm" data-act="wbs-edit" data-id="${esc(w.id)}">Ubah</button><button class="btn sm del" data-act="del" data-col="wbs" data-id="${esc(w.id)}">${S.confirm==='wbs'+w.id?'Yakin?':'Hapus'}</button></div></div>`).join('')}</div><p class="note">Total RAB: <b>${rp(totRab)}</b> · Bobot: <b>${wn.rab?'otomatis dari RAB':'manual'}</b>${wn.rab?'':' · Total bobot '+n1(sum(l,w=>w.weight))+'%'}</p>`;
}

/* ---------- render ---------- */
function renderMain(){
  const m=$('#main');
  if(S.screen==='boot'){m.innerHTML='<div class="card empty">Memuat…</div>';return;}
  if(S.screen==='none'){m.innerHTML='<div class="card"><h2>Perlu masuk</h2><p>Aplikasi ini menyimpan data proyek bersama. Buka lewat akun yang sudah diundang, dari link claude.ai.</p></div>';return;}
  if(S.screen==='home'){m.innerHTML=vHome();return;}
  if(S.screen==='wizard'){m.innerHTML=vWizard();return;}
  if(!S.loaded.cfg&&!S.err){m.innerHTML='<div class="card empty">Memuat data proyek…</div>';return;}
  if(S.err&&!S.cfg){m.innerHTML=`<div class="flag">${esc(S.err)}</div><div class="btns" style="margin-top:10px"><button class="btn" data-act="home">Kembali ke daftar proyek</button></div>`;return;}
  if(!S.cfg){m.innerHTML='<div class="card"><h2>Proyek tidak ditemukan</h2><p>Proyek ini sudah dihapus atau Anda tidak punya akses.</p><button class="btn pri" data-act="home">Kembali ke daftar proyek</button></div>';return;}
  if(S.role==='nomember'){m.innerHTML=`<div class="card"><h2>Anda belum terdaftar di tim</h2><p>Email Anda${S.me.email?' ('+esc(S.me.email)+')':''} tidak ada di daftar tim proyek ini. Minta PM menambahkan email tersebut, lalu buka lagi proyeknya.</p><button class="btn pri" data-act="home">Kembali ke daftar proyek</button></div>`;return;}
  const v={dash:vDash,input:vInput,rekap:vRekap,kurva:vKurva,laporan:vLaporan,arsip:vArsip,tim:vTim,set:vSet}[S.tab];
  m.innerHTML=(S.err?`<div class="flag">${esc(S.err)}</div>`:'')+(v?v():'');
  S.inputBuilt=S.tab==='input'&&!!$('#frm');
  if(S.tab==='input')updateInput();
}
let raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
  if(S.screen==='wizard')return;
  if(S.screen==='home'){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;chrome();renderMain();return;}
  if(S.screen!=='app'){chrome();renderMain();return;}
  S.pm=latestPct(S.site);
  const tl=TABS[S.role]||[];if(tl.length&&!tl.some(t=>t[0]===S.tab)){S.tab=tl[0][0];S.inputBuilt=false;}
  chrome();
  if(S.tab==='input'){if(S.inputBuilt&&S.cfg)updateInput();else renderMain();}
  else if(S.tab==='set'){const f=$('#pf');if(!f)renderMain();else{const w=$('#wbslist');if(w)w.innerHTML=wbsList();const z=$('#w-zone');if(z){const v=z.value;z.innerHTML='<option value="">Semua / umum</option>'+zones().map(q=>`<option>${esc(q)}</option>`).join('');z.value=v;}}}
  else if(S.tab==='tim'){const l=$('#memlist');if(!l)renderMain();else l.innerHTML=memList();}
  else renderMain();});}

/* ---------- actions ---------- */
async function addDoc(col,data){await S.db.collection('projects/'+S.pid+'/'+col).add(Object.assign({},data,{ts:Date.now()}));}
async function compress(file){
  if(!/^image\//.test(file.type))return file;
  return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=1600,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',0.78);};img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;});
}
async function pickFiles(k,files){
  if(!S.assets)return;
  for(const f of files){toast('Mengunggah '+f.name+'…');
    try{const b=await compress(f);const r=await S.assets.upload(b);ATT[k].push({u:r.url,n:f.name,img:/^image\//.test(f.type)});chips(k);}
    catch(e){toast('Gagal mengunggah '+f.name+'. Format ini lewat tautan.');}}
  const i=$('#f-'+k);if(i)i.value='';
}
function linksOf(txt){return String(txt||'').split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>({u:s,n:s.replace(/^https?:\/\//,'').slice(0,40)})).filter(f=>safeUrl(f.u));}
async function submitForm(form){
  const k=form.dataset.form,fd_=new FormData(form),g=n=>(fd_.get(n)||'').toString().trim();
  const base={date:g('date'),zone:g('zone'),by:g('by')};
  if(!base.date||!base.zone||!base.by){toast('Lengkapi tanggal, zona, dan nama pelapor.');return;}
  lsSet('psp_by',base.by);
  let e;
  if(k==='site'){
    const w=S.wbs.find(i=>i.id===g('wbsId'));const pct=g('pct');
    if(S.wbs.some(i=>!i.zone||i.zone===base.zone)&&!w){toast('Pilih item pekerjaan.');return;}
    if(pct!==''&&(+pct<0||+pct>100)){toast('Progres harus 0 sampai 100.');return;}
    const alat=fd_.getAll('alat_n').map((n,i)=>({n:n.trim(),s:fd_.getAll('alat_s')[i]})).filter(a=>a.n);
    e=Object.assign(base,{wbsId:w?w.id:'',wbsName:w?((w.code?w.code+' ':'')+w.name):'',pct:pct===''?null:+pct,vol:g('vol')===''?null:+g('vol'),volUnit:g('volUnit'),workers:g('workers')===''?null:+g('workers'),hours:g('hours')===''?null:+g('hours'),alat,note:g('note'),files:ATT.site.concat(linksOf(g('links')))});
  }else if(k==='gudang'){
    if(!g('material')||g('qty')===''||!g('unit')){toast('Isi material, jumlah, dan satuan.');return;}
    e=Object.assign(base,{jenis:g('jenis'),material:g('material'),qty:+g('qty'),unit:g('unit'),sj:g('sj'),supplier:g('supplier'),note:g('note'),files:ATT.gudang.concat(linksOf(g('links')))});
  }else if(k==='drafter'){
    e=Object.assign(base,{jenis:g('jenis'),no:g('no'),st:g('st'),vol:g('vol')===''?null:+g('vol'),volUnit:g('volUnit'),note:g('note'),files:ATT.drafter.concat(linksOf(g('links')))});
  }else{
    e=Object.assign(base,{pagi:g('pagi'),siang:g('siang'),sore:g('sore'),henti:+g('henti')||0,incident:g('incident'),note:g('note')});
  }
  const btn=$('#sub');btn.disabled=true;
  try{await addDoc(k,e);toast('Laporan tersimpan.');if(ATT[k])ATT[k]=[];S.inputBuilt=false;const d=base.date,z=base.zone;renderMain();$('#in-date').value=d;$('#in-zone').value=z;updateInput();}
  catch(err){toast('Gagal menyimpan ('+((err&&err.code)||'error')+'). Coba lagi.');btn.disabled=false;}
}
async function saveProject(form){
  const f=new FormData(form),g=n=>(f.get(n)||'').toString().trim();
  if(!g('name')){toast('Isi nama proyek.');return;}
  const z=g('zones').split(',').map(s=>s.trim()).filter(Boolean);
  try{await S.db.doc('projects/'+S.pid).update({name:g('name'),location:g('location'),owner:g('owner'),kontraktor:g('kontraktor'),konsultan:g('konsultan'),start:g('start'),end:g('end'),zones:z.length?z:['Seluruh proyek'],drive:{harian:g('drvH'),mingguan:g('drvW')}});toast('Proyek tersimpan.');if(S.zone!=='all'&&!z.includes(S.zone))S.zone='all';}
  catch(e){toast('Gagal menyimpan ('+((e&&e.code)||'error')+').');}
}
async function saveWbs(form){
  const f=new FormData(form),g=n=>(f.get(n)||'').toString().trim();

const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('read'));r.readAsDataURL(blob);});
function drvErr(e){
  const c=e&&e.code;
  if(c==='no_folder')return'ID folder Drive belum diisi. Isi di Pengaturan, bagian Folder Google Drive.';
  if(c==='server_not_connected'||c==='needs_reauth'||c==='selection_required')return'Google Drive belum terhubung. Hubungkan di claude.ai: Pengaturan, Konektor, Google Drive.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return'Izin akses Drive belum diberikan untuk halaman ini. Coba lagi dan pilih Izinkan.';
  if(c==='blocked_by_policy')return'Akses Drive diblokir oleh kebijakan organisasi.';
  if(c==='tool_error')return'Drive menolak unggahan. Periksa ID folder di Pengaturan dan hak akses folder.';
  if(c==='server_unavailable'||c==='upstream_error')return'Hasil unggahan tidak pasti. Cek folder Drive sebelum mengulang, supaya tidak ganda.';
  return'Gagal mengirim ke Drive ('+(c||'error')+').';
}
async function toDrive(kind){
  if(!S.mcp||S.drv.busy||!S.cfg)return;
  const date=S.date,zone=S.zone;S.drv={msg:'Membuat PDF dan mengunggah…',url:'',busy:true};renderMain();
  try{

    const name=(kind==='harian'?'Laporan-Harian-':'Laporan-Mingguan-')+date+(zone==='all'?'':'-'+zone.replace(/[^A-Za-z0-9]+/g,'_'))+'.pdf';
    const folder=((S.cfg.drive&&S.cfg.drive[kind])||'').trim();
    if(!folder)throw{code:'no_folder'};
    let data;
    if(blob.size<650000)data=await b64(blob);
    else{const lt=await S.mcp.listTools();if(!lt.fileArgs)throw{code:'bad_request',message:'File terlalu besar'};data={$file:{data:blob,name,type:'application/pdf'}};}
    const r=await S.mcp.callTool('Google Drive','create_file',{title:name,parentId:folder,contentMimeType:'application/pdf',disableConversionToGoogleType:true,base64Content:data});
    const p=r&&r.payload&&typeof r.payload==='object'?r.payload:{};

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* ---------- parsing RAB ---------- */
function parseNum(s){
  s=String(s==null?'':s).replace(/[Rr][Pp]\.?|\s/g,'');if(!s)return 0;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
function parseDate(s){
  s=String(s||'').trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m)return m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s);
  if(m)return m[3]+'-'+p2(+m[2])+'-'+p2(+m[1]);
  return'';
}
function parseRab(text,ds0,de0){
  const items=[];let skipped=0;
  String(text||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    let c=line.split('\t');if(c.length<3&&line.includes(';'))c=line.split(';');
    c=c.map(x=>x.trim());
    const code=c[0],name=c[1],vol=parseNum(c[2]),unit=c[3],price=parseNum(c[4]);
    if(!name||!(vol>0)||!(price>0)){skipped++;return;}
    let st=parseDate(c[5])||ds0,en=parseDate(c[6])||de0;
    if(pd(en)<pd(st)){st=ds0;en=de0;}
    items.push({code:code||'',name,vol,unit:unit||'',price,start:st,end:en});
  });
  return{items,skipped};
}

        jobs.push(['add',base+'/gudang',{date:off(day),zone:ZN[Math.floor(R()*3)],jenis:'Keluar',material:mt[0],qty:Math.round(30+R()*60),unit:mt[1],sj:'',supplier:'',note:'',files:[],by:'Contoh',ts:T+day*DAY}]);
      }
    }
  }
  [['Shop Drawing','SD-ST-01','Approved',-8],['Shop Drawing','SD-ST-02','Review',-3],['As-Built Drawing','AB-PD-01','Draft',-1],['Opname Volume','OP-01','Review',-2]].forEach(([j,no,st,d],i)=>jobs.push(['add',base+'/drafter',{date:off(d),zone:ZN[i%3],jenis:j,no,st,vol:j==='Opname Volume'?120:null,volUnit:j==='Opname Volume'?'m3':'',note:'',files:[],by:'Contoh',ts:T+d*DAY}]));
  toast('Memuat proyek contoh…');
  try{
    for(let i=0;i<jobs.length;i+=5)await Promise.all(jobs.slice(i,i+5).map(([k,p,d])=>k==='set'?S.db.doc(p).set(d):S.db.collection(p).add(d)));
    openProject(pid);
  }catch(e){toast('Gagal memuat contoh ('+((e&&e.code)||'error')+').');}
}

  else if(a==='att-del'){ATT[b.dataset.k].splice(+b.dataset.i,1);chips(b.dataset.k);}

  else if(a==='copy')copyText($('#watext').textContent);

  else if(a==='pdf-w'){try{await save('Laporan-Mingguan-'+S.date+'.pdf',pdfMingguan(S.date,S.zone).blob);}catch(e){toast(e.message||'Gagal membuat PDF.');}}
  else if(a==='drv-h')toDrive('harian');
  else if(a==='drv-w')toDrive('mingguan');
  else if(a==='pub-h')publish('harian');
  else if(a==='pub-w')publish('mingguan');
  else if(a==='wbs-reset')wbsReset();

});

/* ---------- mode lokal (file HTML dibuka sendiri) ---------- */
function localDB(){
  const KEY='psp_local_v1';let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
  const subs=[];
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const meta={fromCache:false,hasPendingWrites:false};
  const idOf=p=>p.split('/').pop();
  const snapD=p=>({id:idOf(p),exists:p in store,data:()=>p in store?clone(store[p]):undefined,metadata:meta});
  const inCol=c=>Object.keys(store).filter(k=>k.startsWith(c+'/')&&k.split('/').length===c.split('/').length+1).sort();
  const notify=()=>subs.slice().forEach(f=>f());
  const listen=f=>{subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};};
  const mkDoc=p=>({id:idOf(p),path:p,
    get:async()=>snapD(p),
    set:async d=>{store[p]=clone(d);persist();notify();},
    update:async d=>{if(!(p in store))throw{code:'invalid_argument'};store[p]=Object.assign({},store[p],clone(d));persist();notify();},
    delete:async()=>{delete store[p];persist();notify();},
    onSnapshot:next=>listen(()=>next(snapD(p))),
    collection:c=>mkCol(p+'/'+c)});
  const colSnap=c=>{const docs=inCol(c).map(snapD);return{docs,size:docs.length,empty:!docs.length,metadata:meta};};
  const mkCol=c=>({path:c,
    doc:id=>mkDoc(c+'/'+(id||('l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))),
    add:async d=>{const r=mkCol(c).doc();await r.set(d);return r;},
    get:async()=>colSnap(c),
    onSnapshot:next=>listen(()=>next(colSnap(c)))});
  return{doc:mkDoc,collection:mkCol};
}
const localDl={save:async({filename,data})=>{
  const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'};}};

/* ---------- boot ---------- */
async function boot(){
  const claude=window.claude;let db=null,user=null;
  if(claude&&claude.use){
    try{const r=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets'),claude.use('downloads'),claude.use('mcp')]);db=r[0];user=r[1];S.assets=r[2];S.dl=r[3];S.mcp=r[4];}catch(e){}
  }
  if(db){
    S.mode='cloud';S.db=db;
    try{if(user){S.canEdit=await user.canEdit();const me=await user.me();S.me={name:me.name||'',email:(me.email||'').toLowerCase()};S.meCloud=!!S.me.email;}}catch(e){}
  }else if(!claude||!claude.use){
    S.mode='local';S.db=localDB();S.dl=localDl;S.assets=null;S.mcp=null;S.canEdit=true;
  }else{S.screen='none';chrome();renderMain();return;}
  try{const st=JSON.parse(lsGet('psp_me')||'null');if(st){if(!S.me.email)S.me.email=(st.email||'').toLowerCase();if(!S.me.name)S.me.name=st.name||'';}}catch(e){}
  S.screen='home';chrome();renderMain();
  S.db.collection('projects').onSnapshot(s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));S.projLoaded=true;schedule();},e=>{S.projLoaded=true;S.err='Gagal memuat daftar proyek ('+((e&&e.code)||'error')+').';schedule();});
}
boot();
})();
